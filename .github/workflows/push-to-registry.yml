name: push-to-registry

on:
    workflow_run:
        workflows: [build]
        branches: [main]
        types:
            - completed

jobs:
    push-image-to-registry:
        name: Push Docker image to Github registry
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        steps:
            - name: Check out the repo
              uses: actions/checkout@v6

            - name: Log in to the Github Container registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Get version
              id: get_version
              run: |
                  VERSION=$(jq -r '.version' package.json)
                  echo $VERSION
                  echo "version=$VERSION" >> $GITHUB_OUTPUT

            - name: Build a Docker image
              run: |
                  docker build -t ghcr.io/lvchkn/hn-client:${{ steps.get_version.outputs.version }} -t ghcr.io/lvchkn/hn-client:latest .

            - name: Push the image to ghcr
              run: |
                  docker push ghcr.io/lvchkn/hn-client:${{ steps.get_version.outputs.version }}
                  docker push ghcr.io/lvchkn/hn-client:latest
